name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25.5"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go vet
        run: go vet ./...

      - name: Plugin isolation (no pkg/* imports under plugins/)
        run: bash scripts/check-plugin-isolation.sh

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages
        run: go build ./...

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests
        run: go test -race -count=1 ./pkg/...

      - name: Integration tests
        run: go test -race -count=1 -v -run 'TestIT_|TestServer_|TestHandler_' ./pkg/server/...

      - name: Full coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          echo "### Coverage by package" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | grep -E 'total:|^gocache/pkg/[^/]+\s' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  proto-check:
    name: Proto Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protoc
        run: |
          PB_VERSION=35.0
          curl -sSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip" -o protoc.zip
          sudo unzip -o protoc.zip -d /usr/local bin/protoc 'include/*'
          rm protoc.zip
          protoc --version

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Install protoc-gen-go-vtproto
        run: go install github.com/planetscale/vtprotobuf/cmd/protoc-gen-go-vtproto@latest

      - name: Regenerate proto
        run: go generate ./api/gcpc/v1/

      - name: Check for drift
        run: |
          if ! git diff --exit-code api/gcpc/v1/gcpc.pb.go api/gcpc/v1/gcpc_vtproto.pb.go; then
            echo "::error::Generated proto code is out of date. Run 'go generate ./api/gcpc/v1/' and commit."
            exit 1
          fi

  integration-docker:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lifecycle OTLP integration tests
        run: go test -race -count=1 -v -tags "lifecycleotlp,integration" ./plugins/lifecycleotlp/...

      - name: Prometheus integration tests
        run: go test -race -count=1 -v -tags integration ./plugins/prometheus/...

  merge-gate:
    name: PR Ready
    runs-on: ubuntu-latest
    needs: [lint, build, test, proto-check, integration-docker]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.build.result }}"
            "${{ needs.test.result }}"
            "${{ needs.proto-check.result }}"
            "${{ needs.integration-docker.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::Required job failed with result: $r"
              exit 1
            fi
          done
          echo "All required checks passed."
